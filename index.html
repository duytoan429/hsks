<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMOS Auto Register - dt</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <style>
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px;
            max-width: 900px;
            margin: 0 auto;
        }
        .box {
            border: 1px solid #00ff00;
            padding: 12px;
            margin-bottom: 12px;
            background: #111;
        }
        h1 { font-size: 14px; border-bottom: 1px solid #00ff00; padding-bottom: 5px; }
        h2 { font-size: 12px; color: #ffff00; margin-top: 0; }
        button {
            background: #00ff00; color: #000; border: none;
            padding: 8px 14px; font-family: inherit;
            font-weight: bold; cursor: pointer; margin: 3px;
            font-size: 12px;
        }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        input {
            background: #111; border: 1px solid #00ff00;
            color: #00ff00; padding: 6px;
            font-family: inherit; width: 100%;
            box-sizing: border-box; margin: 4px 0;
            font-size: 12px;
        }
        .log {
            height: 200px; overflow-y: auto; font-size: 11px;
            white-space: pre-wrap; border: 1px solid #333;
            padding: 8px; background: #000;
        }
        .success { color: #00ff00; }
        .error { color: #ff4444; }
        .info { color: #ffff00; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .badge { background: #00ff00; color: #000; padding: 2px 6px; font-size: 10px; }
        .badge.red { background: #ff4444; color: #fff; }
        .otp-big {
            font-size: 40px;
            color: #00ff00;
            text-align: center;
            padding: 15px;
            border: 3px dashed #00ff00;
            margin: 10px 0;
            letter-spacing: 10px;
            font-weight: bold;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 2px solid #00ff00;
            background: #fff;
        }
    </style>
</head>
<body>

<h1>VMOS AUTO REGISTER — dt <span class="badge">SUPABASE + UNLIMITMAIL</span></h1>

<div class="box">
    <h2>TRẠNG THÁI</h2>
    <div>SUPABASE: <span id="sbStatus" class="badge red">CHƯA KẾT NỐI</span></div>
    <div>IFRAME: <span id="ifStatus" class="badge red">CHƯA TẢI</span></div>
    <div>STATUS: <span id="status">CHỜ LỆNH</span></div>
</div>

<div class="box">
    <h2>ĐIỀU KHIỂN</h2>
    <button id="btnLoadFrame">1. TẢI UNLIMITMAIL</button>
    <button id="btnReadEmail">2. ĐỌC EMAIL TỪ IFRAME</button>
    <button id="btnScanOTP">3. QUÉT OTP (AUTO)</button>
    <button id="btnStop" disabled>DỪNG QUÉT</button>
    <button id="btnLoadHistory">TẢI LỊCH SỬ</button>
    <button id="btnTestSB">TEST SUPABASE</button>
</div>

<div class="box">
    <h2>THÔNG TIN</h2>
    <div>EMAIL TỪ IFRAME:</div>
    <input type="text" id="tempEmail" readonly placeholder="chưa đọc">
    <div>MẬT KHẨU VMOS:</div>
    <input type="text" id="newPassword" readonly placeholder="chưa tạo">
    <div>OTP:</div>
    <div class="otp-big" id="otpDisplay">------</div>
    <input type="text" id="otpCode" readonly style="display:none;">
    <div>RECORD ID:</div>
    <input type="text" id="recordId" readonly placeholder="chưa lưu">
</div>

<div class="box">
    <h2>NHẬT KÝ</h2>
    <div class="log" id="log"></div>
</div>

<div class="box">
    <h2>UNLIMITMAIL IFRAME</h2>
    <iframe id="mailFrame" src="about:blank"></iframe>
</div>

<div class="box">
    <h2>LỊCH SỬ (SUPABASE)</h2>
    <div class="log" id="historyLog" style="height:120px;"></div>
</div>

<script>
// ============================================================
// CẤU HÌNH SUPABASE
// ============================================================
const SUPABASE_URL = 'https://olsztipsxhopueenrdgu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_znEJflGWJOA1MA54SoebRg_Wkespji2';

let supabaseClient = null;
let isScanning = false;
let scanTimer = null;
let currentEmail = null;
let currentRecordId = null;

// ============================================================
// LOG
// ============================================================
function log(msg, type = 'info') {
    const el = document.getElementById('log');
    const t = new Date().toLocaleTimeString('vi-VN');
    const cls = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
    el.innerHTML += `<span class="${cls}">[${t}] ${msg}</span>\n`;
    el.scrollTop = el.scrollHeight;
}

function logHistory(msg, type = 'info') {
    const el = document.getElementById('historyLog');
    const t = new Date().toLocaleTimeString('vi-VN');
    const cls = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
    el.innerHTML += `<span class="${cls}">[${t}] ${msg}</span>\n`;
    el.scrollTop = el.scrollHeight;
}

function setStatus(s) { document.getElementById('status').textContent = s; }
function setSbStatus(ok, txt) {
    const el = document.getElementById('sbStatus');
    el.textContent = txt;
    el.className = ok ? 'badge' : 'badge red';
}
function setIfStatus(ok, txt) {
    const el = document.getElementById('ifStatus');
    el.textContent = txt;
    el.className = ok ? 'badge' : 'badge red';
}

function generatePassword() {
    const U = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const L = 'abcdefghijklmnopqrstuvwxyz';
    const D = '0123456789';
    const S = '!@#$%^&*';
    let p = U[Math.floor(Math.random() * U.length)]
          + L[Math.floor(Math.random() * L.length)]
          + D[Math.floor(Math.random() * D.length)]
          + S[Math.floor(Math.random() * S.length)];
    const all = U + L + D + S;
    for (let i = 0; i < 8; i++) p += all[Math.floor(Math.random() * all.length)];
    return p.split('').sort(() => Math.random() - 0.5).join('');
}

// ============================================================
// SUPABASE
// ============================================================
function initSupabase() {
    try {
        if (typeof window.supabase === 'undefined') {
            log('THƯ VIỆN SUPABASE CHƯA TẢI.', 'error');
            return false;
        }
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        log('SUPABASE CLIENT ĐÃ KHỞI TẠO.', 'success');
        setSbStatus(true, 'ĐÃ KẾT NỐI');
        return true;
    } catch (e) {
        log(`LỖI SUPABASE: ${e.message}`, 'error');
        setSbStatus(false, 'LỖI');
        return false;
    }
}

async function testSupabase() {
    if (!supabaseClient) return false;
    log('TEST SUPABASE...');
    const { error, count } = await supabaseClient
        .from('registrations')
        .select('*', { count: 'exact' })
        .limit(1);
    if (error) {
        log(`LỖI: ${error.message}`, 'error');
        if (error.code === '42P01') log('=> CHẠY SQL TẠO BẢNG registrations.', 'error');
        return false;
    }
    log(`OK. RECORD: ${count || 0}`, 'success');
    return true;
}

async function saveToDatabase(email, password, otp) {
    if (!supabaseClient) return null;
    log('LƯU VÀO SUPABASE...');
    const { data, error } = await supabaseClient
        .from('registrations')
        .insert({ email, password, otp, service: 'vmos', status: otp ? 'completed' : 'pending' })
        .select()
        .single();
    if (error) {
        log(`LỖI INSERT: ${error.message}`, 'error');
        return null;
    }
    log(`ĐÃ LƯU. ID: ${data.id}`, 'success');
    document.getElementById('recordId').value = data.id;
    return data;
}

async function updateOTP(id, otp) {
    if (!supabaseClient || !id) return;
    const { error } = await supabaseClient
        .from('registrations')
        .update({ otp, status: 'completed' })
        .eq('id', id);
    if (!error) log('ĐÃ CẬP NHẬT OTP VÀO SUPABASE.', 'success');
}

async function loadHistory() {
    if (!supabaseClient) return;
    logHistory('TẢI LỊCH SỬ...');
    const { data, error } = await supabaseClient
        .from('registrations')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(20);
    if (error) { logHistory(`LỖI: ${error.message}`, 'error'); return; }
    document.getElementById('historyLog').innerHTML = '';
    if (!data.length) { logHistory('CHƯA CÓ DỮ LIỆU.'); return; }
    data.forEach(r => {
        const t = new Date(r.created_at).toLocaleString('vi-VN');
        logHistory(`#${r.id} [${t}] ${r.email} | OTP: ${r.otp || '---'} | ${r.status}`,
                   r.status === 'completed' ? 'success' : 'info');
    });
}

// ============================================================
// IFRAME + SCRAPE DOM UNLIMITMAIL
// ============================================================

// Tải iframe UnlimitMail
function loadFrame() {
    log('ĐANG TẢI UNLIMITMAIL VÀO IFRAME...');
    const frame = document.getElementById('mailFrame');
    frame.src = 'https://unlimitmail.com/vi/temp-mail?' + Date.now();
    
    frame.onload = () => {
        log('IFRAME ĐÃ TẢI XONG.', 'success');
        setIfStatus(true, 'ĐÃ TẢI');
        // Chờ 2s cho JS render xong
        setTimeout(() => readEmailFromFrame(), 2000);
    };
}

// Đọc email từ iframe
function readEmailFromFrame() {
    log('ĐANG ĐỌC EMAIL TỪ IFRAME...');
    try {
        const frame = document.getElementById('mailFrame');
        const doc = frame.contentDocument || frame.contentWindow.document;
        
        if (!doc) {
            log('KHÔNG TRUY CẬP ĐƯỢC DOM.', 'error');
            return null;
        }

        // Tìm email trong các selector phổ biến
        let email = null;
        
        // Cách 1: input readonly chứa email
        const inputs = doc.querySelectorAll('input');
        for (const inp of inputs) {
            const v = inp.value || '';
            if (v.includes('@') && v.includes('.')) {
                email = v.trim();
                break;
            }
        }
        
        // Cách 2: element text chứa email
        if (!email) {
            const all = doc.querySelectorAll('*');
            for (const el of all) {
                if (el.children.length > 3) continue;
                const t = (el.textContent || '').trim();
                if (/^[a-z0-9._-]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(t)) {
                    email = t;
                    break;
                }
            }
        }

        if (email) {
            currentEmail = email;
            document.getElementById('tempEmail').value = email;
            log(`EMAIL ĐỌC ĐƯỢC: ${email}`, 'success');
            return email;
        } else {
            log('KHÔNG TÌM THẤY EMAIL TRONG IFRAME.', 'error');
            return null;
        }
    } catch (e) {
        log(`LỖI ĐỌC IFRAME: ${e.message}`, 'error');
        log('CÓ THỂ BỊ CORS. THỬ MỞ DEVTOOLS XEM LỖI.', 'error');
        return null;
    }
}

// Quét OTP từ iframe
function scanOTPFromFrame() {
    try {
        const frame = document.getElementById('mailFrame');
        const doc = frame.contentDocument || frame.contentWindow.document;
        
        if (!doc) return null;

        // Lấy toàn bộ text của iframe
        const bodyText = doc.body ? doc.body.innerText : '';
        
        // Tìm mã 6 số đứng riêng hoặc cạnh text "mã xác minh"
        // Ưu tiên: số 6 chữ số
        const patterns = [
            /mã xác minh[^0-9]{0,100}?(\d{6})/i,
            /mã[^0-9]{0,50}?(\d{6})/i,
            /\b(\d{6})\b/
        ];

        for (const pat of patterns) {
            const m = bodyText.match(pat);
            if (m && m[1]) {
                return m[1];
            }
        }
        return null;
    } catch (e) {
        return null;
    }
}

// Bắt đầu quét OTP tự động
function startScan() {
    if (isScanning) return;
    if (!currentEmail) {
        log('CHƯA ĐỌC ĐƯỢC EMAIL. BẤM NÚT 2 TRƯỚC.', 'error');
        return;
    }

    isScanning = true;
    setStatus('ĐANG QUÉT OTP');
    document.getElementById('btnScanOTP').disabled = true;
    document.getElementById('btnStop').disabled = false;
    log('BẮT ĐẦU QUÉT OTP (mỗi 3 giây)...');

    scanTimer = setInterval(() => {
        const otp = scanOTPFromFrame();
        if (otp) {
            stopScan();
            document.getElementById('otpDisplay').textContent = otp;
            document.getElementById('otpCode').value = otp;
            log(`TÌM THẤY OTP: ${otp}`, 'success');
            log('COPY VÀ DÁN VÀO VMOS.', 'success');
            
            // Copy clipboard
            try {
                navigator.clipboard.writeText(otp);
                log('ĐÃ COPY VÀO CLIPBOARD.', 'success');
            } catch (e) {}

            // Lưu Supabase
            if (currentRecordId) updateOTP(currentRecordId, otp);
            setStatus('HOÀN TẤT');
        }
    }, 3000);
}

function stopScan() {
    isScanning = false;
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    document.getElementById('btnScanOTP').disabled = false;
    document.getElementById('btnStop').disabled = true;
    log('ĐÃ DỪNG QUÉT.', 'info');
    if (isScanning === false) setStatus('ĐÃ DỪNG');
}

// ============================================================
// TẠO PASSWORD + LƯU SUPABASE
// ============================================================
async function createAndSave() {
    const email = readEmailFromFrame();
    if (!email) {
        log('KHÔNG CÓ EMAIL. BẤM NÚT 1 VÀ 2 TRƯỚC.', 'error');
        return;
    }

    const password = generatePassword();
    document.getElementById('newPassword').value = password;
    log(`MẬT KHẨU ĐÃ TẠO: ${password}`, 'success');

    const row = await saveToDatabase(email, password, null);
    if (row) currentRecordId = row.id;

    log('NHẬP EMAIL + PASSWORD VÀO VMOS NGAY.', 'info');
    window.open('https://www.vmoscloud.com/register', '_blank');
}

// ============================================================
// GẮN SỰ KIỆN
// ============================================================
document.getElementById('btnLoadFrame').addEventListener('click', loadFrame);
document.getElementById('btnReadEmail').addEventListener('click', () => {
    readEmailFromFrame();
    createAndSave();
});
document.getElementById('btnScanOTP').addEventListener('click', startScan);
document.getElementById('btnStop').addEventListener('click', stopScan);
document.getElementById('btnLoadHistory').addEventListener('click', loadHistory);
document.getElementById('btnTestSB').addEventListener('click', testSupabase);

// Khởi tạo
window.addEventListener('load', async () => {
    log('HỆ THỐNG SẴN SÀNG.');
    log('QUY TRÌNH: BẤM 1 → 2 → NHẬP VMOS → 3', 'info');
    await new Promise(r => setTimeout(r, 800));
    if (initSupabase()) await testSupabase();
});
</script>

</body>
</html>
