<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMOS OTP Reader - dt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a0a; color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px; line-height: 1.5;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px; margin-bottom: 15px;
        }
        h1 { font-size: 15px; letter-spacing: 2px; }
        h2 {
            font-size: 12px; color: #ffff00;
            margin-bottom: 8px; border-left: 3px solid #ffff00;
            padding-left: 8px;
        }
        .box {
            border: 1px solid #00ff00; padding: 12px;
            margin-bottom: 12px; background: #111;
        }
        .badge {
            background: #00ff00; color: #000;
            padding: 3px 8px; font-weight: bold; font-size: 11px;
        }
        .badge.red { background: #ff4444; color: #fff; }
        .badge.yellow { background: #ffff00; color: #000; }
        .badge.gray { background: #444; color: #aaa; }
        button {
            background: #00ff00; color: #000; border: none;
            padding: 10px 16px; font-family: inherit;
            font-weight: bold; font-size: 12px; cursor: pointer;
            margin: 3px 3px 3px 0; letter-spacing: 1px;
        }
        button:hover:not(:disabled) { background: #00cc00; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        button.danger { background: #ff4444; color: #fff; }
        input {
            background: #000; border: 1px solid #00ff00;
            color: #00ff00; padding: 8px;
            font-family: inherit; font-size: 12px; width: 100%;
        }
        .otp-display {
            font-size: 56px; color: #00ff00; text-align: center;
            padding: 20px; border: 3px dashed #00ff00; background: #000;
            letter-spacing: 12px; font-weight: bold; margin: 10px 0;
            transition: all 0.3s;
        }
        .otp-display.found {
            border-color: #ffff00; color: #ffff00;
            animation: pulse 0.5s ease-in-out 4;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .log {
            height: 220px; overflow-y: auto; font-size: 11px;
            white-space: pre-wrap; background: #000;
            border: 1px solid #333; padding: 10px;
        }
        .success { color: #00ff00; }
        .error { color: #ff4444; }
        .info { color: #ffff00; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field label {
            display: block; font-size: 11px;
            color: #ffff00; margin-bottom: 4px;
        }
        .note { font-size: 10px; color: #888; font-style: italic; margin-top: 5px; }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .otp-display { font-size: 40px; letter-spacing: 8px; }
        }
    </style>
</head>
<body>
<div class="container">

    <header>
        <h1>VMOS OTP READER — dt</h1>
        <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin-top:8px;">
            <span>EMAIL: <span id="emailStatus" class="badge gray">CHƯA TẠO</span></span>
            <span>SCAN: <span id="scanStatus" class="badge gray">DỪNG</span></span>
            <span>POLL: <span id="pollCount" class="badge gray">0</span></span>
        </div>
    </header>

    <div class="box">
        <h2>ĐIỀU KHIỂN</h2>
        <button id="btnCreate">1. TẠO EMAIL MỚI</button>
        <button id="btnStartScan" disabled>2. BẮT ĐẦU QUÉT OTP</button>
        <button id="btnStopScan" class="danger" disabled>DỪNG</button>
        <button id="btnManual">QUÉT NGAY</button>
        <button id="btnTestNotify">TEST THÔNG BÁO</button>
        <button id="btnClear">XÓA LOG</button>
    </div>

    <div class="box">
        <h2>THÔNG TIN EMAIL</h2>
        <div class="field">
            <label>EMAIL ĐANG THEO DÕI</label>
            <input type="text" id="watchEmail" readonly placeholder="chưa tạo — bấm nút 1">
        </div>
        <div class="note">
            Copy email này dán vào form VMOS. Đợi VMOS gửi OTP → web tự bắt được.
            (1secmail.com — miễn phí, không cần đăng ký, có API sẵn)
        </div>
    </div>

    <div class="box">
        <h2>OTP NHẬN ĐƯỢC</h2>
        <div class="otp-display" id="otpDisplay">------</div>
        <div class="grid">
            <div class="field">
                <label>TRẠNG THÁI</label>
                <input type="text" id="otpStatus" readonly value="CHƯA CÓ">
            </div>
            <div class="field">
                <label>THỜI GIAN NHẬN</label>
                <input type="text" id="otpTime" readonly value="---">
            </div>
        </div>
    </div>

    <div class="box">
        <h2>NHẬT KÝ</h2>
        <div class="log" id="log"></div>
    </div>

</div>

<script>
// ============================================================
// CẤU HÌNH 1SECMAIL
// ============================================================
const API = 'https://www.1secmail.com/api/v1/';
const DOMAINS = ['1secmail.com', '1secmail.net', '1secmail.org', 'kzccv.com', 'qiott.com', 'wuuvo.com'];

// ============================================================
// BIẾN
// ============================================================
let watchEmail = null;
let isScanning = false;
let scanTimer = null;
let pollCount = 0;
let lastOTP = null;
let seenMessageIds = new Set();

// ============================================================
// LOG
// ============================================================
function log(msg, type = 'info') {
    const el = document.getElementById('log');
    const t = new Date().toLocaleTimeString('vi-VN');
    const cls = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
    el.innerHTML += `<span class="${cls}">[${t}] ${msg}</span>\n`;
    el.scrollTop = el.scrollHeight;
}

function setBadge(id, text, color) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'badge ' + (color || 'gray');
}

// ============================================================
// TẠO EMAIL 1SECMAIL
// ============================================================
function createEmail() {
    log('ĐANG TẠO EMAIL 1SECMAIL...');
    setBadge('emailStatus', 'ĐANG TẠO', 'yellow');

    const user = 'vmos' + Math.random().toString(36).substring(2, 12);
    const domain = DOMAINS[Math.floor(Math.random() * DOMAINS.length)];
    const email = `${user}@${domain}`;

    watchEmail = email;
    seenMessageIds = new Set();
    lastOTP = null;

    document.getElementById('watchEmail').value = email;
    document.getElementById('otpDisplay').textContent = '------';
    document.getElementById('otpStatus').value = 'CHƯA CÓ';
    document.getElementById('otpTime').value = '---';
    document.getElementById('pollCount').textContent = '0';

    setBadge('emailStatus', 'SẴN SÀNG', '');
    log(`EMAIL ĐÃ TẠO: ${email}`, 'success');
    log('COPY EMAIL NÀY DÁN VÀO FORM VMOS.', 'info');
    document.getElementById('btnStartScan').disabled = false;
}

// ============================================================
// GỌI API 1SECMAIL
// ============================================================
async function fetchInbox(email) {
    const [login, domain] = email.split('@');
    const url = `${API}?action=getMessages&login=${login}&domain=${domain}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
}

async function fetchMessage(email, id) {
    const [login, domain] = email.split('@');
    const url = `${API}?action=readMessage&login=${login}&domain=${domain}&id=${id}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
}

// ============================================================
// QUÉT INBOX
// ============================================================
async function scanInbox() {
    if (!watchEmail) return;

    pollCount++;
    document.getElementById('pollCount').textContent = pollCount;

    try {
        const messages = await fetchInbox(watchEmail);

        if (!Array.isArray(messages) || messages.length === 0) {
            return;
        }

        log(`INBOX CÓ ${messages.length} EMAIL.`, 'info');

        for (const msg of messages) {
            const id = msg.id;
            if (seenMessageIds.has(id)) continue;
            seenMessageIds.add(id);

            log(`EMAIL MỚI: ${msg.subject || '(không tiêu đề)'} TỪ ${msg.from}`, 'info');

            // Lấy nội dung đầy đủ
            const full = await fetchMessage(watchEmail, id);
            if (!full) continue;

            const text = (full.subject || '') + ' ' + (full.textBody || '') + ' ' + (full.body || '');

            // Tìm OTP 6 số
            const m = text.match(/\b\d{6}\b/);
            if (m) {
                showOTP(m[0]);
                stopScan();
                return;
            }
        }
    } catch (e) {
        log(`LỖI QUÉT: ${e.message}`, 'error');
    }
}

// ============================================================
// HIỂN THỊ OTP
// ============================================================
function showOTP(otp) {
    if (otp === lastOTP) return;
    lastOTP = otp;

    const display = document.getElementById('otpDisplay');
    display.textContent = otp;
    display.classList.add('found');
    setTimeout(() => display.classList.remove('found'), 2500);

    document.getElementById('otpStatus').value = 'ĐÃ TÌM THẤY';
    document.getElementById('otpTime').value = new Date().toLocaleString('vi-VN');

    log(`OTP: ${otp}`, 'success');

    // Copy clipboard
    if (navigator.clipboard) {
        navigator.clipboard.writeText(otp)
            .then(() => log('ĐÃ COPY VÀO CLIPBOARD.', 'success'))
            .catch(() => log('COPY THỦ CÔNG.', 'info'));
    }

    // Bíp
    try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        [0, 200, 400].forEach(d => setTimeout(() => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.frequency.value = 1000;
            o.connect(g); g.connect(ac.destination);
            g.gain.value = 0.3;
            o.start(); o.stop(ac.currentTime + 0.15);
        }, d));
        setTimeout(() => ac.close(), 1000);
    } catch (e) {}

    // Thông báo
    if ('Notification' in window && Notification.permission === 'granted') {
        try {
            new Notification('VMOS OTP', { body: otp, requireInteraction: true, tag: 'vmos-otp' });
        } catch (e) {}
    }
}

// ============================================================
// ĐIỀU KHIỂN
// ============================================================
function startScan() {
    if (isScanning) return;
    if (!watchEmail) { log('CHƯA CÓ EMAIL.', 'error'); return; }

    isScanning = true;
    pollCount = 0;
    setBadge('scanStatus', 'ĐANG QUÉT', '');
    document.getElementById('btnStartScan').disabled = true;
    document.getElementById('btnStopScan').disabled = false;
    log('BẮT ĐẦU QUÉT (mỗi 3 giây)...');

    scanInbox();
    scanTimer = setInterval(scanInbox, 3000);
}

function stopScan() {
    isScanning = false;
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    setBadge('scanStatus', 'DỪNG', 'red');
    document.getElementById('btnStartScan').disabled = false;
    document.getElementById('btnStopScan').disabled = true;
}

async function requestNotify() {
    if (!('Notification' in window)) { log('KHÔNG HỖ TRỢ.', 'error'); return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
        log('ĐÃ CẤP QUYỀN THÔNG BÁO.', 'success');
        new Notification('VMOS OTP', { body: 'Thông báo đã bật.' });
    } else {
        log('TỪ CHỐI QUYỀN THÔNG BÁO.', 'error');
    }
}

// ============================================================
// SỰ KIỆN
// ============================================================
document.getElementById('btnCreate').addEventListener('click', createEmail);
document.getElementById('btnStartScan').addEventListener('click', startScan);
document.getElementById('btnStopScan').addEventListener('click', stopScan);
document.getElementById('btnManual').addEventListener('click', () => {
    log('QUÉT THỦ CÔNG...');
    scanInbox();
});
document.getElementById('btnTestNotify').addEventListener('click', requestNotify);
document.getElementById('btnClear').addEventListener('click', () => {
    document.getElementById('log').innerHTML = '';
    log('ĐÃ XÓA LOG.');
});

window.addEventListener('load', () => {
    log('HỆ THỐNG SẴN SÀNG.');
    log('QUY TRÌNH: BẤM 1 → COPY EMAIL → NHẬP VMOS → BẤM 2.', 'info');
    log('EMAIL DÙNG 1SECMAIL.COM — KHÔNG CẦN PROXY, KHÔNG CẦN SUPABASE.', 'success');
});
</script>
</body>
</html>
